<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flomo Input Options</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .form-group label {
            flex: 0 0 150px; /* 固定标签宽度 */
            margin-right: 10px;
            font-weight: bold;
        }
        input[type="text"] {
            flex: 1; /* 使输入框占据剩余空间 */
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #4CAF50; /* 聚焦时的边框颜色 */
            outline: none;
        }
        input[type="checkbox"] {
            margin-left: 10px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049; /* 悬停时的背景颜色 */
        }
        #status {
            margin-top: 10px;
            font-size: 14px;
            color: #4CAF50; /* 状态消息的颜色 */
        }
    </style>
</head>
<body>
    <h1>Flomo Input Options</h1>
    <div class="form-group">
        <label for="api-url">API URL:</label>
        <input type="text" id="api-url" placeholder="Enter API URL">
    </div>
    <div class="form-group">
        <label for="foreground-toggle">Enable foreground toggle:</label>
        <input type="checkbox" id="foreground-toggle">
    </div>
    <button id="save">Save</button>
    <p id="status"></p>

    <script src="options.js"></script>
</body>
</html>
